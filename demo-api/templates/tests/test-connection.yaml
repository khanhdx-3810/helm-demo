apiVersion: v1
kind: Pod
metadata:
  name: {{ include "demo-api.fullname" . }}-test-connection
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
      args:
        - "-qO-"
        - "{{ include "demo-api.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.readiness.path }}"
